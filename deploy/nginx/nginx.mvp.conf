# ═══════════════════════════════════════════════════════════
#  رزرونو MVP — nginx فقط برای پنل کسب‌وکار
#  بر پایه‌ی سخت‌گیری‌های deploy/nginx/nginx.conf ولی فقط سروِ پنلِ بیزینس
#  در ریشه + پراکسی /api/. (پنل‌های customer/company/landing/seo حذف شده‌اند.)
#
#  استفاده (روی سرور، همه‌چیز در داکر):
#    docker compose -f docker-compose.yml -f docker-compose.mvp.yml up -d --build
# ═══════════════════════════════════════════════════════════

# ── ریت‌لیمیت‌ها: زون‌های مختلف برای مسیرهای مختلف ──
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;      # ورود: ۵ در دقیقه
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;      # API عمومی
limit_req_zone $binary_remote_addr zone=static_limit:10m rate=60r/s;   # فایل‌های استاتیک

# ── محدودیت تعداد اتصال هم‌زمان per IP (ضد flood) ──
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ── پاسخ به ریت‌لیمیت: 429 (نه 503) ──
limit_req_status 429;
limit_conn_status 429;

# ── لاگ برای مانیتورینگ حملات ──
log_format security '$remote_addr - [$time_local] "$request" '
                    '$status bytes=$body_bytes_sent '
                    'ua="$http_user_agent" ref="$http_referer"';

server {
    listen 80;
    server_name _;

    # ── مخفی‌کردن نسخه و اطلاعات سرور ──
    server_tokens off;

    # ── محدودیت اندازه‌ی درخواست (ضد حمله‌ی payload بزرگ) ──
    client_max_body_size 6M;
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 8k;

    # ── تایم‌اوت‌ها (ضد Slowloris) ──
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 30s;
    reset_timedout_connection on;

    # ── فشرده‌سازی ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types
      application/json
      application/javascript
      application/x-javascript
      text/javascript
      text/css
      text/plain
      text/html
      image/svg+xml
      application/manifest+json;

    # ── محدودیت اتصال هم‌زمان ──
    limit_conn conn_limit 20;

    # ── هدرهای امنیتی کامل ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;
    # HSTS: فرضِ TLS در لایه‌ی بالادست (load balancer / ingress). برای TLS مستقیم،
    # بلوک listen 443 را با certbot فعال کن.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    # ⚠️ 'unsafe-inline' برای script/style لازم است چون پنل‌ها تک‌فایل HTML با
    #   اسکریپت/استایل inline‌اند. مسیر سخت‌سازی: nonce در build.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # ── بلاک اسکنرها و بات‌های بد ──
    if ($http_user_agent ~* (nikto|sqlmap|nmap|masscan|nessus|metasploit|havij|acunetix|wpscan)) {
        return 403;
    }
    if ($http_user_agent = "") {
        return 403;
    }

    # ── بلاک متدهای خطرناک ──
    if ($request_method !~ ^(GET|POST|PATCH|PUT|DELETE|OPTIONS|HEAD)$) {
        return 405;
    }

    # ── healthcheck داخلیِ کانتینر ──
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # ── حفاظت از فایل‌های حساس ──
    location ~ /\.(?!well-known) { deny all; return 404; }
    location ~* \.(env|git|sql|sh|bak|config|yml|yaml)$ { deny all; return 404; }

    # ── مسیرهای ورود/OTP: سخت‌گیرانه‌ترین ریت‌لیمیت ──
    location ~ ^/api/v1/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_conn conn_limit 5;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        proxy_connect_timeout 5s;
    }

    # ── آپلودِ عکسِ گالری (سقف بالاتر) ──
    location = /api/v1/restaurant/photos {
        client_max_body_size 10M;
        client_body_timeout 120s;
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering on;
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
    }

    # ── عکس‌های آپلودشده ──
    location ^~ /api/v1/media/ {
        limit_req zone=static_limit burst=40 nodelay;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # ── بقیه‌ی API ──
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # ── دارایی‌های استاتیک (کش بلندمدت) ──
    location ~* \.(woff2?|ttf|otf|eot|png|jpg|jpeg|gif|webp|svg|ico)$ {
        root /usr/share/nginx/html/business;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # ── پنلِ کسب‌وکار (ریشه) ──
    location / {
        limit_req zone=static_limit burst=20 nodelay;
        root /usr/share/nginx/html/business;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}