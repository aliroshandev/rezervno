# ── Override محلی (برای توسعه‌ی بومی API) ──
# postgres و redis را به پورت‌های هاست باز می‌کند تا API روی Node هاست به آن‌ها
# برسد. نامِ پروژه جدا است تا با deployment تولید تداخل نکرده و کانتینرهایش
# با `rezervnoosv2-main` (compose اصلی) قاطی نشوند.
# اجرا:  docker compose -f docker-compose.local.yml up -d --build
version: "3.9"

name: rezervno-local

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rezervno}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?رمز دیتابیس را در .env تنظیم کن}
      POSTGRES_DB: ${POSTGRES_DB:-rezervno}
    ports:
      - "5432:5432"
    volumes:
      - local_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # امنیت: رمز روی شبکه‌ی داخلی (کیف امنیتی — برای توسعه محلی هم محکم است)
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?رمز Redis را در .env تنظیم کن}
    ports:
      - "6379:6379"
    volumes:
      - local_redisdata:/data

volumes:
  local_pgdata:
  local_redisdata: