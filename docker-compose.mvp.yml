# ═══════════════════════════════════════════════════════════
#  رزرونو MVP — override سرور (فقط پنل کسب‌وکار)
#
#  استفاده (روی سرور، همه‌چیز در داکر):
#    docker compose -f docker-compose.yml -f docker-compose.mvp.yml \
#      --profile http up -d --build
#  (nginx در compose پایه با پروفایلِ «http» است و override آن را غیرفعال نمی‌کند؛
#   پس برای بالا آمدن نرم‌افزارِ سرو، حتماً --profile http لازم است.)
#
#  profileهای «backup» و «cron» عمداً فعال نیستند — برای MVP فقط
#  nginx + api + postgres + redis بالا می‌آید.
#
#  این override سه کار می‌کند:
#    1. nginx فقط پنلِ کسب‌وکار را در ریشه سرو می‌کند (nginx.mvp.conf) و
#       فقط همین پوشه را mount می‌کند — customer/company هم‌گوش نیستند.
#    2. ALLOWED_ORIGINS در production اجباری می‌شود (بدون آن کانتینر بالا نمی‌آید)
#       تا middleware چکِ CSRF/Origin هرگز بی‌صدا خاموش نشود.
#    3. RUN_SEED را می‌توان با متغیر env از بیرون کنترل کرد.
# ═══════════════════════════════════════════════════════════
services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # در compose پایه nginx با پروفایلِ «http» است؛ override همان را فعال می‌کند.
    # (کامپوز، لیست profile را ادغام می‌کند و `[]` آن را خالی نمی‌کند — از این رو
    #  «--profile http» در دستورِ بالا الزامی است.)
    profiles: ["http"]
    ports:
      - "80:80"
      # برای HTTPS بعد از تنظیم SSL: - "443:443"
    volumes:
      - ./deploy/nginx/nginx.mvp.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/business:/usr/share/nginx/html/business:ro

  api:
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS را در .env تنظیم کن (مثلاً https://business.rezervno.ir)}

  # ── بکاپ و cron از compose پایه ارث می‌برند ولی برای MVP در پروفایلِ غیرفعال
  #    قرار می‌گیرند تا با `up` پیش‌فرض **بیلد **نشوند. چرا: هر دو از
  #    `apk add` روی CDNِ آلپاین (dl-cdn.alpinelinux.org) وابسته‌اند که در شبکه‌ی
  #    سرور در دسترس نیست (TLS error → build شکست → `up` کل پروژه را متوقف می‌کند).
  #    برای MVP فقط nginx + api + postgres + redis لازم است.
  #    فعال‌سازیِ مجدد (وقتی شبکه/S3 در دسترس بود):
  #      docker compose -f docker-compose.yml -f docker-compose.mvp.yml \
  #        --profile backup --profile cron up -d --build
  backup:
    restart: unless-stopped
    profiles: ["backup"]
  cron:
    restart: unless-stopped
    profiles: ["cron"]